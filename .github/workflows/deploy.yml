name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale de `packageManager` en `package.json`.
      #
      # Escribirla aquí fue lo que rompió la CI: el workflow iba con **pnpm 9**,
      # que exige el campo `packages` en `pnpm-workspace.yaml`, y el fichero del
      # repo usa campos de **pnpm 10+** (`allowBuilds`, `minimumReleaseAgeExclude`).
      # `pnpm store path` —que es lo que llama `setup-node` para la caché— fallaba
      # con "packages field missing or empty" y la CI moría en 13 s, **antes de
      # instalar nada**. Cero ejecuciones verdes en todo el historial del workflow.
      #
      # Con la versión en un solo sitio, esto no puede volver a pasar: si el repo
      # sube de pnpm, la CI sube sola.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # El binario nativo de better-sqlite3 está compilado para el ABI de
          # Node 24; con Node 20 los tests unitarios fallan al cargar el módulo.
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CI: "1"

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}