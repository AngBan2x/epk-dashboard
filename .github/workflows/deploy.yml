name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm tiene que ser la misma que la del repo.
      #
      # Escribir aquí un **9** fue lo que rompió la CI: en pnpm 9, la existencia de
      # un `pnpm-workspace.yaml` **exige** el campo `packages`, y el fichero del
      # repo usa campos de **pnpm 10+** (`allowBuilds`, `minimumReleaseAgeExclude`).
      # `pnpm store path` —que es lo que llama `setup-node` para la caché— fallaba
      # con "packages field missing or empty" y la CI moría en 13 s, **antes de
      # instalar nada**. Cero ejecuciones verdes en todo el historial del workflow.
      #
      # El rango vive en `engines.pnpm` de `package.json`; aquí se pide la major.
      # Los dos sitios dicen lo mismo a propósito: pnpm **avisa** si la versión no
      # cumple el rango, así que desalinearlas se ve en el install.
      #
      # P14 — **No usar `packageManager` en `package.json` para esto.** En pnpm 12 ese
      # campo no es el "pin" de corepack: es el gestor de dependencias del gestor,
      # y añadirlo convierte el lockfile en un **doble documento YAML** con 157
      # líneas de binarios de pnpm para todas las plataformas. El lockfile de este
      # repo es de un solo documento (`lockfileVersion 9.0`) y así se queda.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          # El binario nativo de better-sqlite3 está compilado para el ABI de
          # Node 24; con Node 20 los tests unitarios fallan al cargar el módulo.
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # El navegador no venía en la imagen del runner. Sin este paso, los E2E
      # morían con "browserType.launch: Executable doesn't exist at
      # /home/runner/.cache/ms-playwright/…" — y como la CI no se ejecutaba
      # desde el 2026-09-30, **nadie se había enterado de que faltaba**.
      #
      # `--with-deps` instala también las librerías del sistema (en Linux,
      # Chromium necesita un puñado). En el runner de GitHub se puede sin sudo.
      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Las credenciales de los specs de E2E. `TEST_ADMIN_PASSWORD` **no
          # tiene default en el repo** (P7), así que sin este secreto los
          # E2E fallan al pedirlo — que es lo que debe pasar: un default
          # silencioso sería una contraseña real en el código.
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          CI: "1"

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
