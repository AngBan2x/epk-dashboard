name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm tiene que ser la misma que la del repo.
      #
      # Escribir aquí un **9** fue lo que rompió la CI: en pnpm 9, la existencia de
      # un `pnpm-workspace.yaml` **exige** el campo `packages`, y el fichero del
      # repo usa campos de **pnpm 10+** (`allowBuilds`, `minimumReleaseAgeExclude`).
      # `pnpm store path` —que es lo que llama `setup-node` para la caché— fallaba
      # con "packages field missing or empty" y la CI moría en 13 s, **antes de
      # instalar nada**. Cero ejecuciones verdes en todo el historial del workflow.
      #
      # El rango vive en `engines.pnpm` de `package.json`; aquí se pide la major.
      # Los dos sitios dicen lo mismo a propósito: pnpm **avisa** si la versión no
      # cumple el rango, así que desalinearlas se ve en el install.
      #
      # P14 — **No usar `packageManager` en `package.json` para esto.** En pnpm 12 ese
      # campo no es el "pin" de corepack: es el gestor de dependencias del gestor,
      # y añadirlo convierte el lockfile en un **doble documento YAML** con 157
      # líneas de binarios de pnpm para todas las plataformas. El lockfile de este
      # repo es de un solo documento (`lockfileVersion 9.0`) y así se queda.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          # El binario nativo de better-sqlite3 está compilado para el ABI de
          # Node 24; con Node 20 los tests unitarios fallan al cargar el módulo.
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit Tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

      # El navegador no venía en la imagen del runner. Sin este paso, los E2E
      # morían con "browserType.launch: Executable doesn't exist at
      # /home/runner/.cache/ms-playwright/…" — y como la CI no se ejecutaba
      # desde el 2026-09-30, **nadie se había enterado de que faltaba**.
      #
      # `--with-deps` instala también las librerías del sistema (en Linux,
      # Chromium necesita un puñado). En el runner de GitHub se puede sin sudo.
      - name: Instalar el navegador de Playwright
        run: npx playwright install --with-deps chromium

      # Comprobar las credenciales ANTES de gastar 53 minutos en los E2E.
      #
      # Sin `TEST_ADMIN_PASSWORD` en el secret store, los specs hacen login con
      # la contraseña vacía, el servidor responde 400, y **45 tests fallan** con
      # "login -> 400" y luego "login falló con 429" (el rate limit de login es
      # de 5/min por IP, y la CI comparte IP: los reintentos se bloquean a sí
      # mismos). El resultado es un run de una hora con 45 errores que no dicen
      # nada del problema real.
      #
      # Este step falla en el segundo 2 y dice exactamente qué falta. Es el mismo
      # patrón que `cleanup-shows.yml`: **fallar ruidosamente antes**, no
      # después de 53 minutos de ruido.
      #
      # ⚠️ La contraseña **no** tiene default en el repo, a propósito (P7): un
      # default silencioso sería una contraseña real en el código.
      #
      # P21.12 — **Los tres roles, no solo el de admin.** Antes solo se miraba
      # `TEST_ADMIN_PASSWORD`, y con él creado el run quedaba en verde mientras
      # **6 specs** seguían muriendo: `approvals`, `fanout`, `notifications`,
      # `phase-n-artist`, `shows-transitions` y `subscriptions` hacen login con
      # `ARTIST_EMAIL` / `ARTIST_PASSWORD`. Ese email **no tiene default**
      # (`scripts/lib/credentials.ts`): la única cuenta de artista conocida es de
      # una persona real, así que es PII y no puede estar en el repo.
      #
      # Se comprueban **los tres a la vez** y se listan **todos** los que falten
      # en un solo run: fallar de uno en uno costaría tres corridas para decir
      # lo mismo.
      #
      # `TEST_SUBSCRIBER_*` **no** se piden aquí: esos specs se auto-registran.
      - name: Comprobar las credenciales de los E2E
        env:
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ARTIST_EMAIL: ${{ secrets.TEST_ARTIST_EMAIL }}
          TEST_ARTIST_PASSWORD: ${{ secrets.TEST_ARTIST_PASSWORD }}
        run: |
          faltan=0
          if [ -z "${TEST_ADMIN_PASSWORD:-}" ]; then
            echo "::error::Falta el secreto TEST_ADMIN_PASSWORD (cuenta admin@epk.local). Sin él los specs de admin fallan con 'login -> 400'. Crear en Settings -> Secrets and variables -> Actions -> Secrets. Ver docs/PHASE_P21.md (P21.6)."
            faltan=1
          fi
          if [ -z "${TEST_ARTIST_EMAIL:-}" ] || [ -z "${TEST_ARTIST_PASSWORD:-}" ]; then
            echo "::error::Faltan los secretos TEST_ARTIST_EMAIL y/o TEST_ARTIST_PASSWORD. 6 specs hacen login como artista (approvals, fanout, notifications, phase-n-artist, shows-transitions, subscriptions). TEST_ARTIST_EMAIL no tiene default en el repo: es PII de una persona real y no puede estar en el código. Crear en Settings -> Secrets and variables -> Actions -> Secrets. Ver docs/PHASE_P21.md (P21.12)."
            faltan=1
          fi
          if [ "$faltan" -ne 0 ]; then
            echo "::error::Quedan secretos de E2E por crear. Este paso falla a propósito en el segundo 2 para no gastar una hora de corrida en 45 errores que no dicen nada."
            exit 1
          fi
          echo "Credenciales de los tres roles presentes."

      - name: E2E (Playwright)
        run: pnpm test:e2e
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Las credenciales de los specs de E2E. `TEST_ADMIN_PASSWORD` **no
          # tiene default en el repo** (P7), así que sin este secreto los
          # E2E fallan al pedirlo — que es lo que debe pasar: un default
          # silencioso sería una contraseña real en el código.
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          # P21.12 — los specs de artista leen estas dos. Sin exponerlas aquí,
          # el preflight pasa y el spec revienta al importar `credentials.ts`.
          TEST_ARTIST_EMAIL: ${{ secrets.TEST_ARTIST_EMAIL }}
          TEST_ARTIST_PASSWORD: ${{ secrets.TEST_ARTIST_PASSWORD }}
          CI: "1"

      # P21.14 — la CI escribe en Turso de producción (el job levanta `pnpm dev`
      # con `TURSO_*` inyectados), así que lo que los specs dejan hay que
      # retirarlo en el mismo job. Medido el 2026-11-24 con dry-run: **10
      # usuarios QA** acumulados en `epk-dashboard` desde hace semanas.
      #
      # `if: always()`: si un spec falla a medias es cuando MÁS hace falta
      # limpiar. Sin eso, la corrida roja es la que más datos basura deja.
      #
      # El script es dry-run por defecto; `--apply` es la única forma de escribir.
      # Sus patrones son prefijos de QA (`@qa.test`, `[QA]`, `QA `…) y no casan
      # con datos reales — ver `scripts/qa-cleanup.ts`.
      - name: Limpiar los datos QA que dejaron los E2E
        if: always()
        run: npx tsx scripts/qa-cleanup.ts --apply
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

      # P21.16 — **aquí no se despliega.** El deploy lo hace la integración Git
      # de Vercel: cada push a `main` crea un deployment de producción y deja un
      # estado `Vercel` en el commit (`gh api repos/…/commits/<sha>/status`).
      #
      # Los dos pasos `amondnet/vercel-action` que había aquí se han quitado por
      # tres motivos, y el primero es que **nunca funcionaron**:
      #
      #   1. `Error! Project not found ({"VERCEL_PROJECT_ID":…})`. Los secretos
      #      son del 2026-08-30 y apuntan a un proyecto que ya no es el de
      #      `.vercel/project.json` (`prj_qVpbwnHF9HAyZxlJXp8vT2Q6wK0B`,
      #      team `team_bv2GM3Q7sN5Lyb7A1FjeuAJ5`). No es que se rompieran: es
      #      que el paso solo se alcanza cuando el E2E pasa, y el E2E no pasó
      #      nunca hasta el 2026-11-24. Se estrenó el 2026-11-26 en rojo.
      #   2. Con la integración Git activa, el mismo commit tendría **dos**
      #      deploys de producción compitiendo por el alias.
      #   3. Un run verde tiene que quedar verde. Este paso convertía en rojo el
      #      primer run de la historia con los 150 E2E en verde.
      #
      # Si algún día se quiere deploy por tags (P21.4), ese paso sustituye a la
      # integración Git; no convive con ella sin decidir cuál manda el alias.
