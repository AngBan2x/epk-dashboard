<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PressPlay · tarjeta social Instagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { width: 1080px; height: 1350px; background: #0a0f1a; }
  body { width: 1080px; height: 1350px; margin: 0; background: #0a0f1a; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 96px; -webkit-font-smoothing: antialiased; }
  .frame { width: 100%; max-width: 888px; text-align: center; }
  .kicker { font-size: 19px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #a78bfa; margin-bottom: 24px; text-wrap: balance; }
  .propuesta { font-size: 31px; line-height: 1.5; color: #ffffff; margin-bottom: 40px; text-wrap: balance; }
  .propuesta em { font-style: normal; color: #c084fc; font-weight: 700; }
  .regla { width: 120px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, #4f46e5, #8b5cf6, #ec4899, #10b981); margin: 0 auto 56px auto; }
  .marca { font-size: 100px; font-weight: 800; letter-spacing: -0.03em; color: #ffffff; line-height: 1.02; margin: 0 0 10px 0; text-wrap: balance; }
  .categoria { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; color: #4f46e5; margin-bottom: 64px; text-wrap: balance; }
  .etiqueta-url { font-size: 20px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #a78bfa; margin-bottom: 10px; text-wrap: balance; }
  .url { font-size: 40px; font-weight: 800; letter-spacing: 0.01em; color: #ffffff; margin-bottom: 14px; text-wrap: balance; word-break: break-all; }
  .handle { font-size: 20px; color: #94a3b8; text-wrap: balance; }
</style>
</head>
<body>
  <div class="frame">
    <p class="kicker">PressPlay · @pressplayepk</p>
    <p class="propuesta">El Electronic Press Kit donde el artista junta su bio, releases, fechas y rider t&eacute;cnico en un solo sitio. La ficha que abre un periodista, un promotor o un festival antes de decidir.</p>
    <div class="regla"></div>
    <p class="marca">PressPlay</p>
    <p class="categoria">electronic press kit</p>
    <p class="etiqueta-url">Abre el kit</p>
    <p class="url">epk-dashboard.vercel.app</p>
    <p class="handle">@pressplayepk</p>
  </div>
</body>
</html>
